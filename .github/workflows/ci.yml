name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './python/strands-exaone[dev]'
      - run: ruff check python/strands-exaone
      - run: ruff format --check python/strands-exaone
      - run: complexipy python/strands-exaone/src --max-complexity-allowed 15
      - run: python -m pytest python/strands-exaone/tests
      - run: python -c 'import strands_exaone'
      - run: cd python/strands-exaone && hatch build
      - run: python -m pip install --force-reinstall --no-deps python/strands-exaone/dist/*.whl
      - run: python -c 'from strands_exaone import ExaoneModel; print(ExaoneModel.__name__)'

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --workspace=strands-exaone --dry-run
