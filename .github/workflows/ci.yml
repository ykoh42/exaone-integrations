name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            harness-version: '0.1.2'
          - python-version: '3.10'
            harness-version: '0.3.4'
          - python-version: '3.11'
            harness-version: '0.3.4'
          - python-version: '3.12'
            harness-version: '0.3.4'
          - python-version: '3.13'
            harness-version: '0.3.4'
          - python-version: '3.14'
            harness-version: '0.3.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './packages/strands-exaone-py[dev]'
      - run: python -m pip install 'strands-harness==${{ matrix.harness-version }}'
      - run: ruff check packages/strands-exaone-py
      - run: ruff format --check packages/strands-exaone-py
      - run: complexipy packages/strands-exaone-py/src --max-complexity-allowed 15
      - run: python -m pytest packages/strands-exaone-py/tests
      - run: python -c 'import strands_exaone'
      - run: cd packages/strands-exaone-py && hatch build
      - run: python -m pip install --force-reinstall --no-deps packages/strands-exaone-py/dist/*.whl
      - run: python -c 'from strands_exaone import ExaoneModel; print(ExaoneModel.__name__)'
      - run: python -c 'from importlib.resources import files; assert files("strands_exaone").joinpath("py.typed").is_file()'

  langchain-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: uv.lock
          working-directory: packages/langchain-exaone-py
      - working-directory: packages/langchain-exaone-py
        run: uv sync --locked --all-groups
      - working-directory: packages/langchain-exaone-py
        run: uv run --locked ruff check src tests
      - working-directory: packages/langchain-exaone-py
        run: uv run --locked ruff format --check src tests
      - working-directory: packages/langchain-exaone-py
        run: uv run --locked pytest
      - working-directory: packages/langchain-exaone-py
        run: uv build
      - name: Verify wheel in an independent environment
        working-directory: packages/langchain-exaone-py
        run: |
          python -m venv "$RUNNER_TEMP/langchain-exaone-python-venv"
          "$RUNNER_TEMP/langchain-exaone-python-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/langchain-exaone-python-venv/bin/python" -c 'from langchain_core.language_models import BaseChatModel; from langchain_exaone import ChatEXAONE; assert isinstance(ChatEXAONE(api_key="package-check"), BaseChatModel)'
          "$RUNNER_TEMP/langchain-exaone-python-venv/bin/python" -c 'from importlib.resources import files; assert files("langchain_exaone").joinpath("py.typed").is_file()'

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '24']
        harness-version: ['0.1.1', '0.3.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - if: matrix.harness-version == '0.1.1'
        run: npm install --no-save --workspace=strands-exaone @strands-agents/harness@0.1.1
      - run: npm run check
      - name: Verify npm package in an independent project
        run: |
          npm pack --workspace=strands-exaone --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/exaone-package-check"
          cd "$RUNNER_TEMP/exaone-package-check"
          printf '%s\n' '{"private":true}' > package.json
          test "$(npm prefix)" = "$(pwd -P)"
          npm install --ignore-scripts "$RUNNER_TEMP"/strands-exaone-*.tgz
          node --input-type=module -e "import { ExaoneModel } from 'strands-exaone'; import { Model } from '@strands-agents/sdk'; if (!(new ExaoneModel() instanceof Model)) process.exit(1)"

  strands-typescript-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/strands-exaone-ts/package-lock.json
      - run: npm install --global npm@11.20.0
      - working-directory: packages/strands-exaone-ts
        run: npm ci --ignore-scripts --workspaces=false
      - working-directory: packages/strands-exaone-ts
        run: npm run check --workspaces=false
      - name: Verify npm package in an independent project
        working-directory: packages/strands-exaone-ts
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/strands-exaone-package-check"
          cd "$RUNNER_TEMP/strands-exaone-package-check"
          printf '%s\n' '{"private":true}' > package.json
          npm install --ignore-scripts "$RUNNER_TEMP"/strands-exaone-*.tgz
          node --input-type=module -e "import { ExaoneModel } from 'strands-exaone'; import { Model } from '@strands-agents/sdk'; if (!(new ExaoneModel() instanceof Model)) process.exit(1)"

  langchain-typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/langchain-exaone-ts/package-lock.json
      - run: npm install --global npm@11.20.0
      - working-directory: packages/langchain-exaone-ts
        run: npm ci --ignore-scripts --workspaces=false
      - working-directory: packages/langchain-exaone-ts
        run: npm run check --workspaces=false
      - name: Verify npm package in an independent project
        working-directory: packages/langchain-exaone-ts
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/langchain-exaone-package-check"
          cd "$RUNNER_TEMP/langchain-exaone-package-check"
          cat > package.json <<'JSON'
          {"private":true}
          JSON
          npm install --ignore-scripts "$RUNNER_TEMP"/langchain-exaone-*.tgz
          node --input-type=module -e "import { BaseChatModel } from '@langchain/core/language_models/chat_models'; import { ChatExaone } from 'langchain-exaone'; if (!(new ChatExaone({ apiKey: 'package-check' }) instanceof BaseChatModel)) process.exit(1)"
          node -e "const { ChatExaone } = require('langchain-exaone'); if (new ChatExaone({ apiKey: 'package-check' })._llmType() !== 'exaone') process.exit(1)"
