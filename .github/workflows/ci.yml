name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './packages/strands-exaone-python[dev]'
      - run: ruff check packages/strands-exaone-python
      - run: ruff format --check packages/strands-exaone-python
      - run: complexipy packages/strands-exaone-python/src --max-complexity-allowed 15
      - run: python -m pytest packages/strands-exaone-python/tests
      - run: python -c 'import strands_exaone'
      - run: cd packages/strands-exaone-python && hatch build
      - run: python -m pip install --force-reinstall --no-deps packages/strands-exaone-python/dist/*.whl
      - run: python -c 'from strands_exaone import ExaoneModel; print(ExaoneModel.__name__)'
      - run: python -c 'from importlib.resources import files; assert files("strands_exaone").joinpath("py.typed").is_file()'

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run check
      - name: Verify npm package in an independent project
        run: |
          npm pack --workspace=strands-exaone --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/exaone-package-check"
          cd "$RUNNER_TEMP/exaone-package-check"
          npm install --ignore-scripts "$RUNNER_TEMP"/strands-exaone-*.tgz
          node --input-type=module -e "import { ExaoneModel } from 'strands-exaone'; import { Model } from '@strands-agents/sdk'; if (!(new ExaoneModel() instanceof Model)) process.exit(1)"
