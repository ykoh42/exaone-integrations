[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-exaone"
version = "0.1.3"
description = "LangChain chat model integration for the EXAONE API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["exaone", "langchain", "chat model", "llm", "reasoning", "tool calling"]
dependencies = [
    "httpx>=0.27,<1",
    "langchain-core>=1.3.3,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
recovery = ["langchain>=1.5,<2; python_version >= '3.11'"]

[project.urls]
Repository = "https://github.com/ykoh42/exaone-integrations"
Homepage = "https://github.com/ykoh42/exaone-integrations/tree/main/packages/langchain-exaone-py#readme"
Documentation = "https://github.com/ykoh42/exaone-integrations/tree/main/packages/langchain-exaone-py#readme"
Issues = "https://github.com/ykoh42/exaone-integrations/issues"
Changelog = "https://github.com/ykoh42/exaone-integrations/blob/main/packages/langchain-exaone-py/CHANGELOG.md"

[dependency-groups]
test = [
    "langchain>=1.5,<2; python_version >= '3.11'",
    "langchain-tests==1.1.9",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]
lint = ["ruff>=0.16,<0.18"]

[tool.hatch.build]
exclude = [".env", ".env.*", "!.env.example", ".envrc", ".envrc.*", "!.envrc.example", ".direnv", ".netrc", ".npmrc", ".pypirc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/langchain_exaone/**/*.py",
    "/src/langchain_exaone/**/py.typed",
    "/tests/**/*.py",
    "/examples/**/*.py",
    "/examples/**/README.md",
    "/examples/**/requirements.txt",
    "/examples/**/package.json",
    "/.env.example",
    "/.envrc.example",
    "/src/langchain_exaone/**/.env.example",
    "/src/langchain_exaone/**/.envrc.example",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
include = ["/src/langchain_exaone/**/*.py", "/src/langchain_exaone/**/py.typed", "/src/langchain_exaone/**/.env.example", "/src/langchain_exaone/**/.envrc.example"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "TID252"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
