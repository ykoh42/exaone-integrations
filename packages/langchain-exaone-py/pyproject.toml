[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-exaone"
version = "0.1.0"
description = "LangChain chat model integration for the EXAONE API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27,<1",
    "langchain-core>=1.7.5,<2",
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/ykoh42/exaone-integrations"

[dependency-groups]
test = [
    "langchain-tests==1.1.9",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]
lint = ["ruff>=0.16,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_exaone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
