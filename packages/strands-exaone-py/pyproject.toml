[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "strands-exaone"
version = "0.1.1"
description = "EXAONE model provider for Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "strands-agents>=1.64.0,<1.65.0",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "truststore>=0.10,<1",
    "typing-extensions>=4.13.2,<5",
]

[project.optional-dependencies]
dev = [
    "strands-harness~=0.3.4",
    "hatch>=1.0.0,<2.0.0",
    "complexipy>=8.3,<9",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<1.5.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-timeout>=2.0.0,<3.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "ruff>=0.16.0,<0.18.0",
]

[project.urls]
Repository = "https://github.com/ykoh42/exaone-integrations"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_exaone"]

[tool.hatch.build.targets.sdist]
exclude = ["/.complexipy_cache"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 90

[tool.coverage.run]
branch = true
source = ["src"]
